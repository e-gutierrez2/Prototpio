<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body class="pagina-login">
  <main class="login-escena">
    <img src="../img/LogoSonora.svg" alt="LogoSonora" class="login-logo">
    <div class="carpeta">
      <div class="carpeta-pestana">
        <nav class="carpeta-etiqueta">
          <a href="Invitado.html">Home</a>
          <a href="Register.html">Register</a>
        </nav>
      </div>
      <div class="carpeta-cuerpo">
        <div class="login-izq">
          <h1 class="login-titulo">Bienvenido de nuevo</h1>
          <div class="login-redes">
            <a href="#" aria-label="Google">G</a>
            <a href="#" aria-label="X">X</a>
            <a href="#" aria-label="Reddit">R</a>
            <a href="#" aria-label="GitHub">GH</a>
          </div>
        </div>
        <div class="login-der">
          <label class="campo">
            <span>Email</span>
            <input type="email" class="plastico">
          </label>
          <label class="campo">
            <span>Contraseña</span>
            <span class="campo-pass">
              <input type="password" class="plastico" value="contraseña">
              <button type="button" class="btn-ojo" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </span>
          </label>
          <a href="#" class="olvido">¿Olvidaste tu contraseña?</a>
        </div>
        <a href="IndexLogin.html" class="btn-login">Iniciar sesión</a>
      </div>
    </div>
  </main>
</body>
</html>
