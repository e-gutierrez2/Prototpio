<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body class="pagina-registro">

  <main class="registro">
    <div class="registro-marca">
      <img src="../img/LogoSonoraVertical.svg" alt="LogoVerticalSonora" class="registro-logo">
    </div>

    <div class="libreta">
      <div class="libreta-anillas">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <a href="login.html" class="libreta-btn libreta-volver" aria-label="Volver al inicio de sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <a href="Invitado.html" class="libreta-btn libreta-cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>

      <div class="libreta-campos">
        <label class="campo-libreta">
          <span>Usuario</span>
          <input type="text">
        </label>
        <label class="campo-libreta">
          <span>Email</span>
          <input type="email">
        </label>
        <label class="campo-libreta">
          <span>Contraseña</span>
          <input type="password" value="contraseña">
        </label>
        <label class="campo-libreta">
          <span>Confirmar contraseña</span>
          <input type="password" value="contraseña">
        </label>
      </div>

      <a href="index.html" class="btn-registrar">Registrarse</a>
    </div>
  </main>

</body>
</html>
